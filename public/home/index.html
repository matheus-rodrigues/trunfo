<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trunfo - Jogo de Cartas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Rubik:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/home/styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Animated Background -->
      <div class="background-animated"></div>

      <!-- Overlay for better contrast -->
      <div class="overlay"></div>

      <!-- Main Content -->
      <div class="content">
        <h1 class="title">TRUNFO</h1>

        <div class="card">
          <div class="form-container">
            <!-- Form -->
            <div class="input-group">
              <label for="player-name" class="label">Insira seu nome</label>
              <input
                id="player-name"
                type="text"
                placeholder="Seu nome"
                class="input"
              />
            </div>

            <!-- Buttons -->
            <div class="button-group">
              <button id="btn-room" class="button">Criar sala</button>

              <button id="btn-code" class="button">
                Inserir código de jogo
              </button>

              <button id="btn-random" class="button">
                Jogar contra aleatório
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de Erro -->
    <div
      id="modal-error"
      class="modal hidden"
      aria-hidden="true"
      role="alertdialog"
      aria-modal="true"
    >
      <div class="modal-content">
        <button class="modal-close" id="modal-error-close" aria-label="Fechar">
          &times;
        </button>
        <h2 class="modal-title">Ops...</h2>
        <p id="modal-error-message" class="modal-message">Ocorreu um erro.</p>
        <div class="modal-actions">
          <button id="modal-error-ok" class="button">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal Código da Sala -->
    <div
      id="modal-code"
      class="modal hidden"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-content">
        <button class="modal-close" id="modal-code-close" aria-label="Fechar">
          &times;
        </button>
        <h2 class="modal-title">Entrar com código</h2>
        <div class="input-group" style="margin-bottom: 1rem">
          <label for="join-room-code" class="label">Código da sala</label>
          <input
            id="join-room-code"
            type="text"
            maxlength="10"
            placeholder="Ex: ABCDE"
            class="input"
          />
        </div>
        <div class="modal-actions" style="gap: 0.5rem">
          <button
            id="modal-code-cancel"
            class="button"
            style="border-color: #aaa; color: #444"
          >
            Cancelar
          </button>
          <button id="modal-code-confirm" class="button">Entrar</button>
        </div>
      </div>
    </div>

    <script src="/home/script.js"></script>
  </body>
</html>
